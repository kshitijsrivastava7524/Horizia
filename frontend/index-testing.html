<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Light mode colors
                        'primary': '#ffffff',
                        'secondary': '#e5e5e5',
                        'text-main': '#1a1a1a',
                        'text-subtle': '#6b7280',

                        'dark-primary': '#1a1a1a',
                        'dark-secondary': '#333333',
                        'dark-text-main': '#f0f0f0',
                        'dark-text-subtle': '#b0b0b0',

                        // Accent colors
                        "accent-blue": "#2874fc",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
</head>

<body class="bg-[url('images/image1.jpg')] dark:bg-[url('images/image1-dark.jpg')] bg-cover bg-center bg-no-repeat bg-scroll">

    <!-- Main Application Container -->
    <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold mb-6 lg:mb-8 text-gray-100 text-dark-text-main dark:text-dark-text-main">Weather Dashboard</h1>

        <!-- Loading Indicator -->
        <div id="loading-indicator"
            class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-accent-blue"></div>
            <p class="text-xl ml-4 bg-primary dark:bg-dark-primary text-text-main dark:text-dark-text-main rounded-2xl pl-4 pr-4">Loading weather data...</p>
        </div>

        <!-- Main Grid Layout -->
        <!-- Use a flex container for the main grid rows to allow inner elements to grow vertically -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 items-stretch">
            <!-- COLUMN 1: Current Weather --->
            <div class="col-span-12 lg:col-span-4 flex flex-col space-y-4">
                <!-- Current Weather Card -->
                <div
                    class="w-full p-4 md:p-6 bg-primary dark:bg-dark-primary rounded-2xl shadow-2xl border border-secondary dark:border-dark-secondary text-text-main dark:text-dark-text-main transform hover:shadow-primary-line/50 transition duration-300">

                    <div class="w-full flex justify-between items-center mb-6 ">

                        <button id="dark-mode-toggle"
                            class="p-3 bg-secondary dark:bg-dark-secondary text-text-main dark:text-dark-text-main rounded-full hover:bg-opacity-80 transition flex items-center justify-center mr-2"
                            title="Toggle Dark Mode">

                            <svg class="sun-icon w-5 h-5 block dark:hidden" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8a4 4 0 100 8 4 4 0 000-8z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1
                                                                                                        M12 20v1
                                                                                                        M20.66 12h-1
                                                                                                        M3.34 12h1
                                                                                                        M17.78 6.22l-.7.7
                                                                                                        M6.22 17.78l-.7.7
                                                                                                        M17.78 17.78l-.7-.7
                                                                                                        M6.22 6.22l-.7-.7" />
                            </svg>
                            <svg class="moon-icon w-5 h-5 hidden dark:block" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </button>

                        <div id="search-container" class="relative">

                            <input type="text" id="search-input" class="h-11 w-11 rounded-full bg-accent-blue text-dark-text-main dark:text-dark-text-main
           outline-none focus:ring-2 focus:ring-blue-400 
           transition-[width,padding] duration-300 ease-in-out
           placeholder-transparent" placeholder="Search city...">

                            <button id="search-button" class="absolute top-0 right-0 h-11 w-11 p-3 
                   bg-accent-blue dark:accent-blue 
                   text-dark-text-main dark:text-dark-text-main 
                   rounded-full hover:bg-opacity-80 transition
                   flex items-center justify-center">

                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </button>
                        </div>

                    </div>

                    <div class="w-full flex flex-row items-center justify-between text-center py-4">
                        <div>

                            <!-- Temperature -->
                            <div class="w-full flex flex-row items-center justify-between text-center py-4">
                                <div id="current-temp" class="text-4xl sm:text-5xl lg:text-6xl xl:text-7xl font-light ...">
                                    <span id="temp-value">--</span>°C
                                </div>
                                <div id="temp-details" class="flex flex-col text-lg font-medium pl-2 text-text-subtle dark:text-dark-text-subtle">
                                    <span class="opacity-70">H <span id="temp-max">--</span>°</span>
                                    <span class="opacity-70">L <span id="temp-min">--</span>°</span>
                                </div>
                            </div>

                            <!-- Weather and Location -->
                            <div class="text-left pt-2">
                                <div id="current-condition"
                                    class="text-base text-text-subtle dark:text-dark-text-subtle min-h-[1.5rem]">
                                    Enter a city name 
                                </div>
                                <div id="current-location" class="text-sm text-text-subtle dark:text-dark-text-subtle min-h-[1.25rem]">
                                    to load weather data...
                                </div>
                            </div>
                        </div>

                        <div id="current-icon" class="text-8xl sm:text-7xl lg:text-8xl text-text-main dark:text-dark-text-main"> </div>
                    </div>
                </div>

                <!-- Chart Card -->
                <div id="chart-card"
                    class="w-full p-4 md:p-6 bg-primary dark:bg-dark-primary rounded-2xl shadow-2xl border border-secondary dark:border-dark-secondary text-text-main dark:text-dark-text-main transform hover:shadow-primary-line/50 transition duration-300">
                    <!-- Header -->
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">Chart</h2>
                    </div>

                    <!-- Chart Area -->
                    <div class="h-48 sm:h-56 lg:h-64 xl:h-72 mb-6 relative">
                        <canvas id="chartCanvas" class="rounded-lg bg-darker-bg w-full h-full"></canvas>
                    </div>

                    <!-- Footer Stats -->
                    <div class="pt-4 border-t border-gray-800">
                        <p class="text-sm text-gray-400 mb-1">Threshold</p>
                        <div class="flex justify-between items-end">
                            <div class="flex items-baseline space-x-2">
                                <span class="text-4xl font-extrabold text-primary-line">65</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMN 2: Highlights (3-card grid) & Tall Map (Span 8) -->
            <div class="col-span-12 lg:col-span-8 flex flex-col space-y-4">
                <div
                    class="w-full mx-auto p-4 md:p-6 bg-primary dark:bg-dark-primary rounded-2xl shadow-2xl border border-secondary dark:border-dark-secondary text-white transform hover:shadow-primary-line/50 transition duration-300">
                    <!-- 3 Square Image Boxes -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Box 1 -->
                        <div class="rounded-xl overflow-hidden">
                            <img src="../data/output/visualization_rgb.png"
                                class="w-full h-auto object-contain" />
                        </div>

                        <!-- Box 2 -->
                        <div class="rounded-xl overflow-hidden">
                            <img src="../data/output/visualization_probability.png"
                                class="w-full h-auto object-contain"/>
                        </div>

                        <!-- Box 3 -->
                        <div class="rounded-xl overflow-hidden">
                            <img src="../data/output/visualization_overlay.png"
                                class="w-full h-auto object-contain" />
                        </div>
                    </div>
                </div>

                <!-- Weather Map Card -->
                <div
                    class="w-full bg-primary dark:bg-dark-primary rounded-2xl shadow-xl border border-secondary dark:border-dark-secondary overflow-hidden grid grid-cols-1 lg:grid-cols-5 p-6 lg:p-0 transform hover:shadow-primary-line/50 transition duration-300">
                    <!-- Lake Statistics Content -->
                    <div class="lg:col-span-2 flex flex-col justify-center p-6 lg:p-10">
                        <h1 class="text-2xl font-mono text-text-main dark:text-dark-text-main mb-8 leading-tight">
                            --- Lake Statistics ---
                        </h1>

                        <!-- Statistic Rows -->
                        <div class="space-y-4 text-lg font-semibold">
                            <p>
                                <span class="text-text-subtle dark:text-dark-text-subtle">Pixels > 0.5:</span>
                                <span class="text-text-main dark:text-dark-text-main font-bold">1,044,334</span>
                            </p>
                            <p>
                                <span class="text-text-subtle dark:text-dark-text-subtle">Pixel area:</span>
                                <span class="text-text-main dark:text-dark-text-main font-bold">88.377 m²</span>
                            </p>
                            <p class="pt-4 border-t border-text-main dark:border-dark-text-main">
                                <span class="text-text-subtle dark:text-dark-text-subtle">Estimated total lake
                                    area:</span>
                                <span class="text-3xl text-accent-blue font-extrabold">92.295 km²</span>
                            </p>
                            <p>
                                <span class="text-text-subtle dark:text-dark-text-subtle">Lake coverage:</span>
                                <span class="text-text-main dark:text-dark-text-main font-bold">2.00%</span>
                            </p>
                        </div>

                        <div class="mt-auto pt-6 text-gray-400">
                            <h2 class="text-xl font-mono text-text-main dark:text-dark-text-main">
                                --------------------------</h2>
                        </div>
                    </div>

                    <!-- Image -->
                    <div class="lg:col-span-3 flex items-center justify-center relative mt-6 lg:mt-0 p-6 lg:p-8">
                        <div
                            class="absolute inset-4 bg-gradient-to-br from-gray-800 to-gray-900 opacity-30 rounded-2xl">
                        </div>

                        <img src="../contour_map/generated_maps/submission_combined_contour_lake_map-final.png"
                            class="w-full h-full object-cover rounded-xl" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
